name: release

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

env:
    RUST_VERSION: "1.99.0"

jobs:
    build:
        name: build (${{ matrix.name }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    # Windows: cross-compiled from Linux with MinGW. Builds the whole workspace,
                    # including the agent DLL, which only exists for Windows.
                    - name: windows
                      target: x86_64-pc-windows-gnu
                      build: cargo build --release --workspace --no-default-features --target x86_64-pc-windows-gnu
                      artifact_path: |
                          target/x86_64-pc-windows-gnu/release/*.exe
                          target/x86_64-pc-windows-gnu/release/*.dll
                    # Linux: native build of the default members (injector and loader).
                    # The agent is Windows-only and is not built here.
                    - name: linux
                      target: ""
                      build: cargo build --release --no-default-features
                      artifact_path: |
                          target/release/injector
                          target/release/loader

        steps:
            # Full history: the mtime step below diffs against the commit the cached build came from.
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            # YYYY.MM.DD-<7 character commit>, from the commit's UTC date, so every job names the same build the same way.
            - name: Version
              run: |
                  echo "VOLCREN_VERSION=$(TZ=UTC git show -s --format=%cd --date=format-local:%Y.%m.%d HEAD)-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
                  echo "VOLCREN_BUILD=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

            - name: Install MinGW toolchain
              if: matrix.name == 'windows'
              run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

            # rustup comes with the runner image. The version is pinned so a new Rust release doesn't invalidate the build cache.
            - name: Install Rust
              id: rust
              run: |
                  rustup toolchain install "$RUST_VERSION" --profile minimal ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
                  rustup default "$RUST_VERSION"
                  echo "rustc=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

            # Dependencies and this repo's own crates. Each run saves a new entry (the key ends in the commit) and starts from the
            # latest one for the same Cargo.lock, so unchanged crates, including the injector's slow LTO link, are not rebuilt.
            - name: Cache cargo and target
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: build-${{ matrix.name }}-${{ steps.rust.outputs.rustc }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
                  restore-keys: |
                      build-${{ matrix.name }}-${{ steps.rust.outputs.rustc }}-${{ hashFiles('Cargo.lock') }}-

            # Cargo decides a path crate is stale when a source file is newer than its cached build, and a fresh checkout makes
            # every file new. Date every tracked file in the past, then touch only the files changed since the cached build.
            # With no usable baseline, touch everything, which is a normal full build.
            - name: Restore source mtimes
              run: |
                  base=$(cat target/.built-commit 2>/dev/null || true)
                  if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
                      git ls-files -z | xargs -0 touch -c -d '2000-01-01T00:00:00Z'
                      git diff --name-only -z "$base" HEAD | xargs -0 -r touch -c
                      echo "Cached build from $base: $(git diff --name-only "$base" HEAD | wc -l) files changed since."
                  else
                      git ls-files -z | xargs -0 touch -c
                      echo "No usable cached build: full rebuild."
                  fi

            # Uses the `release` profile (full LTO, stripped) from the root Cargo.toml. `--no-default-features` leaves out the
            # lib/ the injector can embed: this repo builds alone, and the loader always runs scripts with `--script`, which reads lib/ from disk.
            - name: Build release
              run: ${{ matrix.build }}

            - name: Record the built commit
              run: mkdir -p target && git rev-parse HEAD > target/.built-commit

            - name: Upload binaries
              uses: actions/upload-artifact@v4
              with:
                  name: volcren-${{ matrix.name }}-release
                  path: ${{ matrix.artifact_path }}
                  if-no-files-found: error

    # The Linux archive: the loader and a native injector, plus the Windows injector and agent that run inside Wine.
    package:
        name: package for Linux
        needs: build
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
            build: ${{ steps.version.outputs.build }}
            api_version: ${{ steps.version.outputs.api_version }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/download-artifact@v4
              with:
                  path: dist

            - name: Version
              id: version
              run: |
                  version="$(TZ=UTC git show -s --format=%cd --date=format-local:%Y.%m.%d HEAD)-$(git rev-parse --short=7 HEAD)"
                  echo "VERSION=$version" >> "$GITHUB_ENV"
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  echo "build=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
                  echo "api_version=$(grep -m1 'pub const API_VERSION' src/loader/src/api/models.rs | grep -o '[0-9]*;' | tr -d ';')" >> "$GITHUB_OUTPUT"

            - name: Package
              run: |
                  mkdir -p out
                  win=dist/volcren-windows-release
                  lin=dist/volcren-linux-release
                  stage=$(mktemp -d)/volcren
                  mkdir -p "$stage"
                  cp "$lin/loader" "$lin/injector" "$win/injector.exe" "$win/agent.dll" "$stage/"
                  chmod +x "$stage/loader" "$stage/injector"
                  tar -C "$(dirname "$stage")" -czf "out/volcren-linux-$VERSION.tar.gz" volcren

            - uses: actions/upload-artifact@v4
              with:
                  name: package-linux
                  path: out/volcren-linux-*.tar.gz
                  if-no-files-found: error

    # The Windows installer, built with WiX on real Windows and tested there. See docs/releases.md.
    msi:
        name: build and test the MSI
        needs: build
        runs-on: windows-latest
        timeout-minutes: 20
        env:
            WIX_VERSION: "5.0.2"
        steps:
            - uses: actions/checkout@v4

            - uses: actions/download-artifact@v4
              with:
                  name: volcren-windows-release
                  path: dist

            # Windows Installer allows 255.255.65535 and ignores a fourth field, so the minute of the month keeps same-day builds apart.
            - name: Version
              shell: bash
              run: |
                  read -r year month day hour minute < <(TZ=UTC git show -s --format=%cd --date=format-local:'%y %m %d %H %M' HEAD)
                  of_month=$(( (10#$day - 1) * 1440 + 10#$hour * 60 + 10#$minute ))
                  echo "MSI_VERSION=$((10#$year)).$((10#$month)).$of_month" >> "$GITHUB_ENV"
                  echo "VERSION=$(TZ=UTC git show -s --format=%cd --date=format-local:%Y.%m.%d HEAD)-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

            # WiX 5 is the last version with no maintenance fee, and it runs on .NET 6.
            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 6.0.x

            - name: Install WiX
              shell: pwsh
              run: |
                  dotnet tool install --global wix --version $env:WIX_VERSION
                  "$env:USERPROFILE\.dotnet\tools" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

            - name: Build
              shell: pwsh
              run: |
                  wix extension add -g "WixToolset.UI.wixext/$env:WIX_VERSION"
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  $bin = (Resolve-Path dist).Path
                  foreach ($build in @(@{ version = "1.0.0"; out = "out\old\volcren.msi" }, @{ version = $env:MSI_VERSION; out = "out\volcren-windows-$env:VERSION.msi" })) {
                      wix build installer\volcren.wxs -arch x64 -ext WixToolset.UI.wixext `
                          -d "Version=$($build.version)" -d "BinDir=$bin" -o $build.out
                      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  }

            - name: Test
              shell: pwsh
              run: |
                  ./installer/test-msi.ps1 -OldMsi (Resolve-Path out\old\volcren.msi).Path `
                      -NewMsi (Resolve-Path "out\volcren-windows-$env:VERSION.msi").Path `
                      -OldVersion 1.0.0 -NewVersion $env:MSI_VERSION

            - uses: actions/upload-artifact@v4
              with:
                  name: package-windows
                  path: out/volcren-windows-*.msi
                  if-no-files-found: error

    # Writes and signs the manifest. It holds the signing key and nothing that can upload, and the key is only available to this Environment.
    sign:
        name: sign the manifest
        needs: [package, msi]
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        environment: release-signing
        env:
            VERSION: ${{ needs.package.outputs.version }}
            BUILD: ${{ needs.package.outputs.build }}
            API_VERSION: ${{ needs.package.outputs.api_version }}
            UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        steps:
            - uses: actions/download-artifact@v4
              with:
                  pattern: package-*
                  merge-multiple: true
                  path: out

            - name: Install rsign
              run: cargo install rsign2 --version 0.6.7 --locked

            - name: Sign
              run: |
                  if [ -z "$UPDATE_SIGNING_KEY" ]; then
                      echo "Set the UPDATE_SIGNING_KEY secret on the release-signing environment." >&2
                      exit 1
                  fi
                  win="volcren-windows-$VERSION.msi"
                  lin="volcren-linux-$VERSION.tar.gz"
                  mkdir manifest
                  jq -n --arg version "$VERSION" --argjson build "$BUILD" --argjson api "${API_VERSION:-1}" \
                      --arg win "$win" --arg winsum "$(sha256sum "out/$win" | cut -d' ' -f1)" \
                      --arg lin "$lin" --arg linsum "$(sha256sum "out/$lin" | cut -d' ' -f1)" \
                      '{version: $version, build: $build, api_version: $api, files: {
                          windows: {name: $win, path: "\($version)/\($win)", sha256: $winsum},
                          linux: {name: $lin, path: "\($version)/\($lin)", sha256: $linsum}}}' > manifest/latest.json
                  cat manifest/latest.json

                  key="$RUNNER_TEMP/update.key"
                  (umask 077 && printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key")
                  rsign sign -W -s "$key" -t "$VERSION" -x "$RUNNER_TEMP/latest.minisig" manifest/latest.json
                  rm -f "$key"

                  # One object, so a loader can never read a new signature with an old manifest.
                  jq -n --rawfile manifest manifest/latest.json --rawfile signature "$RUNNER_TEMP/latest.minisig" \
                      '{manifest: $manifest, signature: $signature}' > manifest/latest.signed.json

                  (cd out && sha256sum * | tee SHA256SUMS)

            - uses: actions/upload-artifact@v4
              with:
                  name: manifest
                  path: manifest
                  if-no-files-found: error

            # The same files the bucket gets, for the GitHub release job below (which has no access to the Supabase key).
            - name: Keep packages for the release
              uses: actions/upload-artifact@v4
              with:
                  name: release-packages
                  path: |
                      out/volcren-windows-*.msi
                      out/volcren-linux-*.tar.gz
                      out/SHA256SUMS
                  if-no-files-found: error

    # On every push to main: publish both platforms and the manifests to the public `client` bucket. latest.signed.json and
    # latest.json go up last, so they never point at files that aren't there yet.
    publish:
        name: publish to the client bucket
        needs: [package, sign]
        if: github.event_name == 'push'
        concurrency:
            group: publish
            cancel-in-progress: false
        runs-on: ubuntu-latest
        outputs:
            version: ${{ needs.package.outputs.version }}
        env:
            VERSION: ${{ needs.package.outputs.version }}
            SUPABASE_URL: ${{ vars.SUPABASE_URL }}
            SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/download-artifact@v4
              with:
                  name: release-packages
                  path: out

            - uses: actions/download-artifact@v4
              with:
                  name: manifest
                  path: manifest

            - name: Install rsign
              run: cargo install rsign2 --version 0.6.7 --locked

            - name: Upload
              run: |
                  if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
                      echo "Set the SUPABASE_URL repository variable and the SUPABASE_SERVICE_KEY secret." >&2
                      exit 1
                  fi
                  # A secret pasted with a trailing newline would end the request headers early and turn the rest
                  # of them into the start of the uploaded file, so only ever send the key without whitespace.
                  SUPABASE_URL="$(printf %s "$SUPABASE_URL" | tr -d '[:space:]')"
                  SUPABASE_SERVICE_KEY="$(printf %s "$SUPABASE_SERVICE_KEY" | tr -d '[:space:]')"
                  upload() { # <local file> <path in the bucket> <content type> [cache-control]
                      curl -sS --fail -X POST "$SUPABASE_URL/storage/v1/object/client/$2" \
                          -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" -H "apikey: $SUPABASE_SERVICE_KEY" \
                          -H "x-upsert: true" -H "Content-Type: $3" -H "cache-control: ${4:-max-age=31536000}" \
                          --data-binary "@$1" > /dev/null
                  }
                  win="volcren-windows-$VERSION.msi"
                  lin="volcren-linux-$VERSION.tar.gz"
                  upload "out/$win" "$VERSION/$win" application/x-msi
                  upload "out/$lin" "$VERSION/$lin" application/gzip
                  upload manifest/latest.signed.json latest.signed.json application/json max-age=60
                  upload manifest/latest.json latest.json application/json max-age=60

                  # What was just published must be this manifest, and signed by a key the loader trusts, or nobody could install it.
                  sleep 2
                  public="$SUPABASE_URL/storage/v1/object/public/client"
                  curl -sS --fail "$public/latest.json?check=$VERSION" -o check.json
                  jq -e --arg version "$VERSION" '.version == $version' check.json > /dev/null \
                      || { echo "The published latest.json is not the manifest that was uploaded." >&2; exit 1; }
                  curl -sS --fail "$public/latest.signed.json?check=$VERSION" -o signed.json
                  jq -j .manifest signed.json > signed.manifest
                  jq -j .signature signed.json > signed.minisig
                  jq -e --arg version "$VERSION" '.version == $version' signed.manifest > /dev/null \
                      || { echo "The published latest.signed.json is not the manifest that was uploaded." >&2; exit 1; }
                  verified=
                  for key in $(grep -oE '"RW[A-Za-z0-9+/]{54}"' src/loader/src/update.rs | tr -d '"'); do
                      rsign verify -P "$key" -x signed.minisig signed.manifest > /dev/null 2>&1 && verified=1
                  done
                  [ -n "$verified" ] || { echo "The published manifest isn't signed by a key in update.rs." >&2; exit 1; }

    # After a successful publish: tag the commit and create a GitHub release with the same packages. Uses only the runner's
    # `gh` and the job token, and runs apart from `publish` so the Supabase key never sits next to a write token.
    release:
        name: tag and release
        needs: publish
        if: github.event_name == 'push'
        permissions:
            contents: write
        runs-on: ubuntu-latest
        env:
            GH_TOKEN: ${{ github.token }}
            GH_REPO: ${{ github.repository }}
            VERSION: ${{ needs.publish.outputs.version }}
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: release-packages
                  path: out

            # Creates the tag at this commit. A re-run of the same commit finds the release already there and leaves it alone.
            - name: Create release
              run: |
                  if gh release view "$VERSION" > /dev/null 2>&1; then
                      echo "Release $VERSION already exists."
                      exit 0
                  fi
                  gh release create "$VERSION" out/* --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
