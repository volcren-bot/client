[package]
name = "loader"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.36.2", features = ["persistence"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
injector = { version = "0.1.0", path = "../injector" }
egui_extras = { version = "0.36", features = ["svg"] }
ureq = { version = "3.5.0", default-features = false, features = ["rustls", "json"] }
sha2 = "0.11.1"
base64 = "0.23.1"
rand = "0.10.3"
webbrowser = "1.2.5"
directories = "6.0.0"
keyring = "4.2.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
