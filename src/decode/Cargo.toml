[package]
name = "decode"
version = "0.1.0"
edition = "2024"
description = "Decoders over the client's memory, run by the agent in-process and by the injector through ReadProcessMemory"

[dependencies]
ipc = { path = "../ipc" }
serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }

[features]
# The in-memory `Fake` the injector's tests read from.
test-support = []
