[workspace]
resolver = "2"
members = ["src/injector", "src/loader", "src/agent", "src/ipc", "src/decode"]
default-members = ["src/injector", "src/loader"]

[profile.release]
strip = true
lto = true

# Faster iteration build: same optimizations as release minus full LTO.
# Use with: cargo build --profile fast
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
